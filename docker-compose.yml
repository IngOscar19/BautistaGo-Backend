services:
  postgres:
    image: postgres:15-alpine
    container_name: bautistago_postgres
    restart: always
    environment:
      POSTGRES_USER: bautista_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bautistago_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bautista_user -d bautistago_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
